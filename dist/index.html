<body class="bg-dark-bg text-white font-inter overflow-x-hidden">
  <div id="app"></div>
  <script>
    window.addEventListener('error', function (event) {
      var overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.backgroundColor = 'rgba(0,0,0,0.9)';
      overlay.style.color = '#ff4444';
      overlay.style.zIndex = '99999';
      overlay.style.padding = '40px';
      overlay.style.fontFamily = 'monospace';
      overlay.style.overflow = 'auto';
      overlay.innerHTML = '<h2>Application Error</h2><p>' + event.message + '</p><p>File: ' + event.filename + '</p><p>Line: ' + event.lineno + '</p>';
      document.body.appendChild(overlay);
    });
    window.addEventListener('unhandledrejection', function (event) {
      var overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.backgroundColor = 'rgba(0,0,0,0.9)';
      overlay.style.color = '#ff4444';
      overlay.style.zIndex = '99999';
      overlay.style.padding = '40px';
      overlay.style.fontFamily = 'monospace';
      overlay.style.overflow = 'auto';
      overlay.innerHTML = '<h2>Unhandled Promise Rejection</h2><p>' + event.reason + '</p>';
      document.body.appendChild(overlay);
    });
  </script>
</body>
